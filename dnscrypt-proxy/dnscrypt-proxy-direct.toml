# Commented out to try every server
# server_names = ['cloudflare', 'google', 'mullvad-adblock-doh', 'mullvad-doh']

listen_addresses = ['0.0.0.0:53']

max_clients = 250

ipv4_servers = true
ipv6_servers = false
dnscrypt_servers = true
doh_servers = true
require_dnssec = true
require_nolog = false
require_nofilter = false

keepalive = 30
lb_strategy = 'p2'

## bootstrap_resolvers are used ONLY at startup to resolve the hostnames
## in [sources] URLs (e.g. raw.githubusercontent.com, download.dnscrypt.info).
## Without these, dnscrypt-proxy cannot fetch its resolver lists.
bootstrap_resolvers = ['1.1.1.1:53', '1.0.0.1:53', '9.9.9.9:53', '8.8.8.8:53']
fallback_resolvers = ['1.1.1.1:53', '1.0.0.1:53', '9.9.9.9:53', '8.8.8.8:53']
ignore_system_dns = false

netprobe_timeout = 60
timeout = 3500
netprobe_address = '1.1.1.1:53'

block_ipv6 =true
block_unqualified = true
block_undelegated = true
reject_ttl = 600

cache = true
cache_size = 4096
cache_min_ttl = 2400
cache_max_ttl = 86400
cache_neg_min_ttl = 60
cache_neg_max_ttl = 600

[blocked_names]
    # blocked_names_file = 'blocked-names.txt'

[sources]

  ### An example of a remote source from https://github.com/DNSCrypt/dnscrypt-resolvers

  [sources.public-resolvers]
    urls = ['https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/public-resolvers.md', 'https://download.dnscrypt.info/resolvers-list/v3/public-resolvers.md']
    cache_file = '/etc/dnscrypt-proxy/resolvers-cache/public-resolvers.md'
    minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'
    refresh_delay = 7200 # long refresh to keep using cached list
    prefix = ''

  ### Anonymized DNS relays

  [sources.relays]
    urls = ['https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/relays.md', 'https://download.dnscrypt.info/resolvers-list/v3/relays.md']
    cache_file = '/etc/dnscrypt-proxy/resolvers-cache/relays.md'
    minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'
    refresh_delay = 7200 # long refresh to keep using cached list
    prefix = ''

## This section is used to inject a private DNS server via docker-compose.
## The 'REQUIRE_ENV_PRIVATE_DNS_STAMP' placeholder is automatically replaced
## with the value of the PRIVATE_DNS_STAMP environment variable when the container starts.
## If the environment variable is not set, this entire section is removed during startup.
# --- DYNAMIC PRIVATE SERVER BLOCK START ---
[static]
  [static.private-server]
  stamp = 'REQUIRE_ENV_PRIVATE_DNS_STAMP'
# --- DYNAMIC PRIVATE SERVER BLOCK END ---
