[project]
name = "proxy-dashboard"
version = "0.1.0"
description = "Docker proxy infrastructure dashboard"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "docker>=7.0",
    "httpx[socks]>=0.28",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "speedtest-cli>=2.1",
    "ruamel-yaml>=0.19.1",
    "websockets>=14",
]

[dependency-groups]
dev = ["ruff>=0.11"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
