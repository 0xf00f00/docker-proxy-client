x-restart-policy: &default-restart unless-stopped

x-default-dns: &default-dns
  - ${FALLBACK_DNS:-192.168.1.1}
  - 1.1.1.1
  - 1.0.0.1

x-proxy-healthcheck: &proxy-healthcheck
  interval: 30s
  timeout: 15s
  retries: 3
  start_period: 60s

x-dns-healthcheck: &dns-healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 120s

services:
  coredns:
    image: coredns/coredns:latest
    container_name: coredns
    restart: *default-restart
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    volumes:
      - ./coredns/Corefile:/Corefile:ro
    command: -conf /Corefile
    depends_on:
      - dnscrypt-proxy
      - dnscrypt-proxy-direct

  dnscrypt-proxy-direct:
    image: gists/dnscrypt-proxy:latest
    container_name: dnscrypt-proxy-direct
    restart: *default-restart
    user: "${UID:-1000}:${GID:-1000}"
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 53 || exit 1"]
      <<: *dns-healthcheck
    dns: *default-dns
    environment:
      - PRIVATE_DNS_STAMP=${PRIVATE_DNS_STAMP}
    command: >
      sh -c "cp /etc/dnscrypt-proxy/dnscrypt-proxy-template.toml /tmp/dnscrypt-proxy.toml &&
      if [ -z \"$$PRIVATE_DNS_STAMP\" ]; then
        sed -i '/# --- DYNAMIC PRIVATE SERVER BLOCK START ---/,/# --- DYNAMIC PRIVATE SERVER BLOCK END ---/d' /tmp/dnscrypt-proxy.toml;
      else
        sed -i 's|REQUIRE_ENV_PRIVATE_DNS_STAMP|'\"$$PRIVATE_DNS_STAMP\"'|g' /tmp/dnscrypt-proxy.toml;
      fi &&
      dnscrypt-proxy -config /tmp/dnscrypt-proxy.toml"
    volumes:
      - ./dnscrypt-proxy/dnscrypt-proxy-direct.toml:/etc/dnscrypt-proxy/dnscrypt-proxy-template.toml:ro
      - ./dnscrypt-proxy/resolvers-cache:/etc/dnscrypt-proxy/resolvers-cache
    networks:
      direct_internet:
        ipv4_address: 192.168.88.243
        gw_priority: 1000
      default:
        ipv4_address: 10.20.0.10

  dnscrypt-proxy:
    image: gists/dnscrypt-proxy:latest
    container_name: dnscrypt-proxy
    restart: *default-restart
    user: "${UID:-1000}:${GID:-1000}"
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 53 || exit 1"]
      <<: *dns-healthcheck
    dns: *default-dns
    volumes:
      - ./dnscrypt-proxy/dnscrypt-proxy.toml:/etc/dnscrypt-proxy/dnscrypt-proxy.toml:ro
      - ./dnscrypt-proxy/resolvers-cache:/etc/dnscrypt-proxy/resolvers-cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        ipv4_address: 10.20.0.11
    depends_on:
      - clash

  naive:
    image: ghcr.io/0xf00f00/naive_proxy:latest
    container_name: naive
    restart: *default-restart
    labels:
      - autoheal=true
    network_mode: host
    dns: *default-dns
    ulimits:
      nofile:
        soft: 65536
        hard: 1048576
    healthcheck:
      test: ["CMD", "bash", "-c", "< /dev/tcp/127.0.0.1/1080 || exit 1"]
      <<: *proxy-healthcheck
    command: naive --listen=socks://0.0.0.0:1080 --proxy=https://${NAIVE_USER}:${NAIVE_PASSWORD}@${NAIVE_SERVER}

  clash:
    image: dreamacro/clash-premium:latest
    container_name: clash
    restart: *default-restart
    network_mode: host
    privileged: true
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 7890 || exit 1"]
      <<: *proxy-healthcheck
    volumes:
      - ./clash/config.yaml:/root/.config/clash/config.yaml:ro
      - ./clash/rules:/root/.config/clash/rules:ro
    dns: *default-dns
    extra_hosts:
      - "naive:127.0.0.1"
      - "psiphon:10.20.0.14"
      - "frpc-proxy:10.20.0.15"
    depends_on:
      - naive
      - frpc-proxy

  singbox-sub:
    image: ghcr.io/sagernet/sing-box:latest
    container_name: singbox-sub
    profiles:
      - singbox
    restart: *default-restart
    dns: *default-dns
    networks:
      direct_internet:
        ipv4_address: 192.168.88.241
        gw_priority: 1000
      default:
        ipv4_address: 10.20.0.13
    ports:
      - "2080:2080"
    volumes:
      - ./singbox-sub/config.json:/etc/sing-box/config.json:ro
    command: -D /var/lib/sing-box -C /etc/sing-box/ run

  singbox-direct:
    image: ghcr.io/sagernet/sing-box:latest
    container_name: singbox-direct
    restart: *default-restart
    labels:
      - autoheal=true
    network_mode: host
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 7891 || exit 1"]
      <<: *proxy-healthcheck
    volumes:
      - ./singbox-direct/config.json:/etc/sing-box/config.json:ro
    command: -C /etc/sing-box/ run
    depends_on:
      - coredns

  psiphon:
    image: ghcr.io/0xf00f00/psiphon-tunnel-core-docker:latest
    container_name: psiphon
    restart: *default-restart
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 1080 || exit 1"]
      <<: *proxy-healthcheck
    networks:
      direct_internet:
        ipv4_address: 192.168.88.240
        gw_priority: 1000
      default:
        ipv4_address: 10.20.0.14
    environment:
      - EGRESS_REGION=${PSIPHON_EGRESS_REGION:-}
    volumes:
      - ./psiphon:/data

  frpc-proxy:
    image: ghcr.io/fatedier/frpc:v0.66.0
    container_name: frpc-proxy
    restart: *default-restart
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 1080 || exit 1"]
      <<: *proxy-healthcheck
    networks:
      direct_internet:
        ipv4_address: 192.168.88.242
        gw_priority: 1000
      default:
        ipv4_address: 10.20.0.15
    volumes:
      - ./frpc-proxy/frpc.toml:/frpc.toml:ro
      - ./frpc-proxy/certs:/data/certs:ro
    environment:
      - FRP_PROXY_SERVER_ADDR=${FRP_PROXY_SERVER_ADDR}
      - FRP_PROXY_AUTH_TOKEN=${FRP_PROXY_AUTH_TOKEN}
      - FRP_PROXY_VISITOR_SK=${FRP_PROXY_VISITOR_SK}
    command: -c /frpc.toml

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: *default-restart
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=60
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # Only starts when --profile dnstt is passed. Extremely slow, use as last resort only.
  dnstt-client:
    image: ghcr.io/0xf00f00/dnstt-client:latest
    container_name: dnstt-client
    profiles:
      - dnstt
    restart: *default-restart
    # Entrypoint watches active_dns.txt for periodic DNS refresh (default 6h)
    entrypoint: ["/bin/bash", "/dnstt/entrypoint.sh"]
    environment:
      - DNSTT_DOMAIN=${DNSTT_DOMAIN}
      - DNSTT_PUBKEY=${DNSTT_PUBKEY}
      - DNSTT_RESOLVER=${DNSTT_RESOLVER:-1.1.1.1:53}
      - DNSTT_REFRESH_INTERVAL=${DNSTT_REFRESH_INTERVAL:-21600}
      - DNSTT_DOH_URL=${DNSTT_DOH_URL}
    volumes:
      - ./dnstt/entrypoint.sh:/dnstt/entrypoint.sh:ro
      - ./dns-scanner/out/active_dns.txt:/dns-scanner/active_dns.txt:ro
    networks:
      direct_internet:
        ipv4_address: 192.168.88.244
        gw_priority: 1000
      default:
        ipv4_address: 10.20.0.16

  dnstt-autossh:
    image: jnovack/autossh:latest
    container_name: dnstt-autossh
    profiles:
      - dnstt
    restart: *default-restart
    ports:
      - "${DNSTT_SOCKS_PORT:-5080}:1080"
    depends_on:
      - dnstt-client
    environment:
      - SSH_REMOTE_USER=${DNSTT_SSH_USER:-tunnel}
      # Connect to dnstt-client via its service name (bridge network)
      - SSH_REMOTE_HOST=dnstt-client
      - SSH_REMOTE_PORT=7000
      - SSH_KEY_FILE=/dnstt/id_rsa
      - SSH_MODE=-L
      - SSH_BIND_IP=127.0.0.1
      - SSH_LOCAL_PORT=5081
      - SSH_TARGET_HOST=localhost
      - SSH_TARGET_PORT=22
      - AUTOSSH_GATETIME=0
      # Final SOCKS proxy inside container on port 1080 (mapped to host via ports)
      - SSH_OPTIONS=-D 0.0.0.0:1080 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    volumes:
      - ./dnstt/id_rsa:/dnstt/id_rsa:ro

# Network definitions
networks:
  # Macvlan for direct internet access (bypasses host TUN routing)
  # Uses static IPs from your LAN subnet - containers appear as devices on the network
  direct_internet:
    driver: macvlan
    driver_opts:
      parent: ${MACVLAN_PARENT:-eth0}
    ipam:
      config:
        - subnet: 192.168.88.0/24
          gateway: 192.168.88.1
          # Reserve .240-.247 for containers (avoid conflicts with router DHCP)
          ip_range: 192.168.88.240/29
  # Default bridge network with static IP assignments for reliable Clash access
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.0.0/24
          gateway: 10.20.0.1
