x-restart-policy: &default-restart unless-stopped

x-default-dns: &default-dns
  - ${FALLBACK_DNS:-192.168.1.1}
  - 1.1.1.1
  - 1.0.0.1

x-proxy-healthcheck: &proxy-healthcheck
  interval: 30s
  timeout: 15s
  retries: 5
  start_period: 90s

x-dns-healthcheck: &dns-healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 120s

services:
  coredns:
    image: coredns/coredns:latest
    container_name: coredns
    restart: *default-restart
    labels:
      - dashboard.enable=true
      - dashboard.category=dns
      - dashboard.name=CoreDNS
      - dashboard.protocol=dns
      - dashboard.port=53
      - dashboard.testable=false
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    volumes:
      - ./coredns/Corefile:/Corefile:ro
    command: -conf /Corefile
    depends_on:
      - dnscrypt-proxy
      - dnscrypt-proxy-direct

  dnscrypt-proxy-direct:
    image: gists/dnscrypt-proxy:latest
    container_name: dnscrypt-proxy-direct
    restart: *default-restart
    labels:
      - dashboard.enable=true
      - dashboard.category=dns
      - dashboard.name=DNSCrypt Direct
      - dashboard.protocol=dns
      - dashboard.port=53
      - dashboard.testable=false
      - dashboard.env=PRIVATE_DNS_STAMP
    user: "${UID:-1000}:${GID:-1000}"
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 53 || exit 1"]
      <<: *dns-healthcheck
    dns: *default-dns
    environment:
      - PRIVATE_DNS_STAMP=${PRIVATE_DNS_STAMP}
    command: >
      sh -c "cp /etc/dnscrypt-proxy/dnscrypt-proxy-template.toml /tmp/dnscrypt-proxy.toml &&
      if [ -z \"$$PRIVATE_DNS_STAMP\" ]; then
        sed -i '/# --- DYNAMIC PRIVATE SERVER BLOCK START ---/,/# --- DYNAMIC PRIVATE SERVER BLOCK END ---/d' /tmp/dnscrypt-proxy.toml;
      else
        sed -i 's|REQUIRE_ENV_PRIVATE_DNS_STAMP|'\"$$PRIVATE_DNS_STAMP\"'|g' /tmp/dnscrypt-proxy.toml;
      fi &&
      dnscrypt-proxy -config /tmp/dnscrypt-proxy.toml"
    volumes:
      - ./dnscrypt-proxy/dnscrypt-proxy-direct.toml:/etc/dnscrypt-proxy/dnscrypt-proxy-template.toml:ro
      - ./dnscrypt-proxy/resolvers-cache:/etc/dnscrypt-proxy/resolvers-cache
    networks:
      direct_internet:
        ipv4_address: 192.168.88.243
        gw_priority: 1000
      default:
        ipv4_address: 10.20.0.10

  dnscrypt-proxy:
    image: gists/dnscrypt-proxy:latest
    container_name: dnscrypt-proxy
    restart: *default-restart
    labels:
      - dashboard.enable=true
      - dashboard.category=dns
      - dashboard.name=DNSCrypt Proxy
      - dashboard.protocol=dns
      - dashboard.port=53
      - dashboard.testable=false
    user: "${UID:-1000}:${GID:-1000}"
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 53 || exit 1"]
      <<: *dns-healthcheck
    dns: *default-dns
    volumes:
      - ./dnscrypt-proxy/dnscrypt-proxy.toml:/etc/dnscrypt-proxy/dnscrypt-proxy.toml:ro
      - ./dnscrypt-proxy/resolvers-cache:/etc/dnscrypt-proxy/resolvers-cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        ipv4_address: 10.20.0.11
    depends_on:
      - clash

  # Legacy klzgrad naive client. TCP only.
  naive:
    image: ghcr.io/0xf00f00/naive_proxy:latest
    container_name: naive
    restart: *default-restart
    labels:
      - autoheal=true
      - dashboard.enable=true
      - dashboard.category=proxy
      - dashboard.name=NaiveProxy (TCP)
      - dashboard.protocol=socks5
      - dashboard.port=1080
      - dashboard.env=NAIVE_SERVER,NAIVE_USER,NAIVE_PASSWORD
    network_mode: host
    dns: *default-dns
    ulimits:
      nofile:
        soft: 65536
        hard: 1048576
    healthcheck:
      test: ["CMD", "bash", "-c", "< /dev/tcp/127.0.0.1/1080 || exit 1"]
      <<: *proxy-healthcheck
    command: naive --listen=socks://0.0.0.0:1080 --proxy=https://${NAIVE_USER}:${NAIVE_PASSWORD}@${NAIVE_SERVER}

  # sing-box naive client with UDP-over-TCP (UoT v2).
  naive-uot:
    image: ghcr.io/sagernet/sing-box:latest
    container_name: naive-uot
    restart: *default-restart
    labels:
      - autoheal=true
      - dashboard.enable=true
      - dashboard.category=proxy
      - dashboard.name=NaiveProxy (UoT)
      - dashboard.protocol=socks5
      - dashboard.port=1081
      - dashboard.env=NAIVE_SERVER,NAIVE_USER,NAIVE_PASSWORD
    network_mode: host
    dns: *default-dns
    ulimits:
      nofile:
        soft: 65536
        hard: 1048576
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 1081 || exit 1"]
      <<: *proxy-healthcheck
    environment:
      - NAIVE_SERVER=${NAIVE_SERVER}
      - NAIVE_USER=${NAIVE_USER}
      - NAIVE_PASSWORD=${NAIVE_PASSWORD}
    volumes:
      - ./naive-uot/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  clash:
    image: dreamacro/clash-premium:latest
    container_name: clash
    restart: *default-restart
    labels:
      - dashboard.enable=true
      - dashboard.category=proxy
      - dashboard.name=Clash Premium
      - dashboard.protocol=http
      - dashboard.port=7890
      - dashboard.widget=system-proxy
      - dashboard.controller=clash
    network_mode: host
    privileged: true
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 7890 || exit 1"]
      <<: *proxy-healthcheck
    volumes:
      - ./clash/config.yaml:/root/.config/clash/config.yaml:ro
      - ./clash/rules:/root/.config/clash/rules:ro
    dns: *default-dns
    extra_hosts:
      - "naive:127.0.0.1"
      - "naive-uot:127.0.0.1"
      - "psiphon:10.20.0.14"
      - "frpc-proxy:10.20.0.15"
      - "xray:10.20.0.18"
    depends_on:
      - naive
      - naive-uot
      - frpc-proxy

  singbox-sub:
    image: ghcr.io/sagernet/sing-box:latest
    container_name: singbox-sub
    restart: *default-restart
    labels:
      - dashboard.enable=true
      - dashboard.category=proxy
      - dashboard.name=SingBox Sub
      - dashboard.protocol=mixed
      - dashboard.port=2080
      - dashboard.config=/singbox-sub/config.json
    dns: *default-dns
    networks:
      direct_internet:
        ipv4_address: 192.168.88.241
        gw_priority: 1000
      default:
        ipv4_address: 10.20.0.13
    ports:
      - "2080:2080"
    volumes:
      - ./singbox-sub/config.json:/etc/sing-box/config.json:ro
    command: -D /var/lib/sing-box -C /etc/sing-box/ run

  goose-relay:
    build:
      context: ./goose-relay
      args:
        GOOSE_VERSION: ${GOOSE_VERSION:-v1.7.1}
    container_name: goose-relay
    restart: *default-restart
    labels:
      - autoheal=true
      - dashboard.enable=true
      - dashboard.category=proxy
      - dashboard.name=GooseRelay
      - dashboard.protocol=socks5
      - dashboard.port=1080
      - dashboard.config=/goose-relay/client_config.json
    dns: *default-dns
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 1080 || exit 1"]
      <<: *proxy-healthcheck
    networks:
      direct_internet:
        ipv4_address: 192.168.88.247
        gw_priority: 1000
      default:
        ipv4_address: 10.20.0.19
    volumes:
      - ./goose-relay/client_config.json:/etc/goose-relay/client_config.json:ro

  xray:
    image: ghcr.io/xtls/xray-core:latest
    container_name: xray
    restart: *default-restart
    labels:
      - dashboard.enable=true
      - dashboard.category=proxy
      - dashboard.name=Xray
      - dashboard.protocol=socks5
      - dashboard.port=10808
      - dashboard.config=/xray/config.json
    dns: *default-dns
    networks:
      direct_internet:
        ipv4_address: 192.168.88.246
        gw_priority: 1000
      default:
        ipv4_address: 10.20.0.18
    ports:
      - "10808:10808"
    volumes:
      - ./xray/config.json:/etc/xray/config.json:ro
    command: run -c /etc/xray/config.json

  singbox-direct:
    image: ghcr.io/sagernet/sing-box:latest
    container_name: singbox-direct
    restart: *default-restart
    labels:
      - autoheal=true
      - dashboard.enable=true
      - dashboard.category=proxy
      - dashboard.name=SingBox Direct
      - dashboard.protocol=socks5
      - dashboard.port=7891
    network_mode: host
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 7891 || exit 1"]
      <<: *proxy-healthcheck
    volumes:
      - ./singbox-direct/config.json:/etc/sing-box/config.json:ro
    command: -C /etc/sing-box/ run
    depends_on:
      - coredns

  psiphon:
    image: ghcr.io/0xf00f00/psiphon-tunnel-core-docker:latest
    container_name: psiphon
    restart: *default-restart
    labels:
      - dashboard.enable=true
      - dashboard.category=proxy
      - dashboard.name=Psiphon
      - dashboard.protocol=socks5
      - dashboard.port=1080
      - dashboard.env=PSIPHON_EGRESS_REGION
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 1080 || exit 1"]
      <<: *proxy-healthcheck
    networks:
      direct_internet:
        ipv4_address: 192.168.88.240
        gw_priority: 1000
      default:
        ipv4_address: 10.20.0.14
    environment:
      - EGRESS_REGION=${PSIPHON_EGRESS_REGION:-}
    volumes:
      - ./psiphon:/data

  frpc-proxy:
    image: ghcr.io/fatedier/frpc:v0.66.0
    container_name: frpc-proxy
    restart: *default-restart
    labels:
      - dashboard.enable=true
      - dashboard.category=proxy
      - dashboard.name=FRP Proxy
      - dashboard.protocol=socks5
      - dashboard.port=1080
      - dashboard.env=FRP_PROXY_SERVER_ADDR,FRP_PROXY_AUTH_TOKEN,FRP_PROXY_VISITOR_SK
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 1080 || exit 1"]
      <<: *proxy-healthcheck
    networks:
      direct_internet:
        ipv4_address: 192.168.88.242
        gw_priority: 1000
      default:
        ipv4_address: 10.20.0.15
    volumes:
      - ./frpc-proxy/frpc.toml:/frpc.toml:ro
      - ./frpc-proxy/certs:/data/certs:ro
    environment:
      - FRP_PROXY_SERVER_ADDR=${FRP_PROXY_SERVER_ADDR}
      - FRP_PROXY_AUTH_TOKEN=${FRP_PROXY_AUTH_TOKEN}
      - FRP_PROXY_VISITOR_SK=${FRP_PROXY_VISITOR_SK}
    command: -c /frpc.toml

  sni-spoofing:
    image: ghcr.io/aleskxyz/sni-spoofing-go:${SNI_SPOOFING_VERSION:-0.5.1}
    container_name: sni-spoofing
    restart: *default-restart
    labels:
      - dashboard.enable=true
      - dashboard.category=proxy
      - dashboard.name=SNI Spoofing
      - dashboard.protocol=tls
      - dashboard.port=40443
      - dashboard.config=/sni-spoofing/config.ini
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/40443'"]
      <<: *proxy-healthcheck
    networks:
      direct_internet:
        ipv4_address: 192.168.88.245
        gw_priority: 1000
      default:
        ipv4_address: 10.20.0.17
    volumes:
      - ./sni-spoofing/config.ini:/etc/sni-spoofing/config.ini:ro
    command: ["-config", "/etc/sni-spoofing/config.ini"]

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: *default-restart
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=120
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  mdns:
    build:
      context: ./mdns
      args:
        MDNS_VERSION: ${MDNS_VERSION:-latest}
    container_name: mdns
    restart: *default-restart
    labels:
      - autoheal=true
      - dashboard.enable=true
      - dashboard.category=proxy
      - dashboard.name=MasterDnsVPN
      - dashboard.protocol=socks5
      - dashboard.port=18000
      - dashboard.config=/mdns/client_resolvers.txt
      - dashboard.env=MDNS_DOMAIN,MDNS_ENCRYPTION_KEY,MDNS_DATA_ENCRYPTION_METHOD,MDNS_MIN_UPLOAD_MTU,MDNS_MAX_UPLOAD_MTU,MDNS_MIN_DOWNLOAD_MTU,MDNS_MAX_DOWNLOAD_MTU
    dns: *default-dns
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 18000 || exit 1"]
      <<: *proxy-healthcheck
    environment:
      - MDNS_DOMAIN=${MDNS_DOMAIN}
      - MDNS_ENCRYPTION_KEY=${MDNS_ENCRYPTION_KEY}
      - MDNS_DATA_ENCRYPTION_METHOD=${MDNS_DATA_ENCRYPTION_METHOD:-1}
      - MDNS_MIN_UPLOAD_MTU=${MDNS_MIN_UPLOAD_MTU:-38}
      - MDNS_MAX_UPLOAD_MTU=${MDNS_MAX_UPLOAD_MTU:-150}
      - MDNS_MIN_DOWNLOAD_MTU=${MDNS_MIN_DOWNLOAD_MTU:-200}
      - MDNS_MAX_DOWNLOAD_MTU=${MDNS_MAX_DOWNLOAD_MTU:-4000}
    volumes:
      - ./mdns/client_resolvers.txt:/etc/mdns/client_resolvers.txt:rw
    networks:
      direct_internet:
        ipv4_address: 192.168.88.244
        gw_priority: 1000
      default:
        ipv4_address: 10.20.0.16

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    container_name: docker-socket-proxy
    restart: *default-restart
    environment:
      - CONTAINERS=1
      - EVENTS=1
      - IMAGES=1
      - INFO=1
      - NETWORKS=1
      - PING=1
      - POST=1
      - VERSION=1
      - VOLUMES=1
      - BUILD=1
      - AUTH=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - EXEC=0
      - NODES=0
      - PLUGINS=0
      - SECRETS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:2375:2375"
    read_only: true
    tmpfs:
      - /run
      - /tmp

  dashboard:
    image: ghcr.io/0xf00f00/docker-proxy-client-dashboard:latest
    container_name: dashboard
    restart: *default-restart
    labels:
      - dashboard.enable=false
    network_mode: host
    user: "${UID:-1000}:${GID:-1000}"
    cap_drop:
      - ALL
    cap_add:
      # Needed to bind privileged ports (e.g. DASHBOARD_PORT=80) as non-root.
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      - DASHBOARD_HOST_LAN_INTERFACE=${MACVLAN_PARENT:-eth0}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-8080}
      - DASHBOARD_BIND=${DASHBOARD_BIND:-0.0.0.0}
      - DASHBOARD_CLASH_API_URL=http://127.0.0.1:9697
      - DASHBOARD_CLASH_API_SECRET=${CLASH_API_SECRET:-}
      - DASHBOARD_COMPOSE_PROJECT_PATH=/compose
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-}
      - DASHBOARD_DOCKER_HOST=tcp://127.0.0.1:2375
      - DOCKER_HOST=tcp://127.0.0.1:2375
    volumes:
      - ./xray/config.json:/configs/xray/config.json
      - ./singbox-sub/config.json:/configs/singbox-sub/config.json
      - ./clash/config.yaml:/configs/clash/config.yaml
      - ./sni-spoofing/config.ini:/configs/sni-spoofing/config.ini
      - ./goose-relay/client_config.json:/configs/goose-relay/client_config.json
      - ./mdns/client_resolvers.txt:/configs/mdns/client_resolvers.txt
      # Mount the repo root so we can update .env and run `docker compose up -d <svc>`
      - .:/compose:rw
    depends_on:
      - docker-socket-proxy

# Network definitions
networks:
  # Macvlan for direct internet access (bypasses host TUN routing)
  # Uses static IPs from your LAN subnet - containers appear as devices on the network
  direct_internet:
    driver: macvlan
    driver_opts:
      parent: ${MACVLAN_PARENT:-eth0}
    ipam:
      config:
        - subnet: 192.168.88.0/24
          gateway: 192.168.88.1
          # Reserve .240-.247 for containers (avoid conflicts with router DHCP)
          ip_range: 192.168.88.240/29
  # Default bridge network with static IP assignments for reliable Clash access
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.0.0/24
          gateway: 10.20.0.1
