mixed-port: 7890

allow-lan: true
bind-address: '*'

hosts:
  naive: 127.0.0.1
  frpc-proxy: 10.20.0.15
  psiphon: 10.20.0.14

# Clash router working mode
# rule: rule-based packet routing
# global: all packets will be forwarded to a single endpoint
# direct: directly forward the packets to the Internet
mode: rule

# info / warning / error / debug / silent
log-level: warning
ipv6: false

dns:
  enable: true
  listen: 0.0.0.0:15335
  default-nameserver:
    - 1.1.1.1
    - 1.0.0.1
  # enhanced-mode: fake-ip
  # fake-ip-range: 198.18.0.1/16 # Fake IP addresses pool CIDR
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

tun:
  enable: true
  stack: system
  auto-route: false
  auto-redir: false
  auto-detect-interface: true

proxies:
  - name: "naive"
    type: socks5
    server: naive
    port: 1080
    udp: true
  - name: "frpc"
    type: socks5
    server: frpc-proxy
    port: 1080
    udp: true
  - name: "psiphon"
    type: socks5
    server: psiphon
    port: 1080
    udp: true

proxy-groups:
  - name: auto
    type: fallback
    proxies:
      - naive
      - frpc
      - psiphon
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    lazy: true
  - name: direct_interface
    type: select
    interface-name: eth0
    proxies: [ 'DIRECT' ]

# update from https://github.com/bootmortis/iran-hosted-domains/releases/
rule-providers:
  ads:
    behavior: "domain"
    type: file
    path: "/root/.config/clash/rules/clash_rules_ads.yaml"
  ir:
    behavior: "domain"
    type: file
    path: "/root/.config/clash/rules/clash_rules_ir.yaml"

rules:
  # Local address
  - IP-CIDR,127.0.0.0/8,REJECT
  - IP-CIDR,172.16.0.0/12,REJECT
  - IP-CIDR,192.168.0.0/16,REJECT

  - IP-CIDR,10.20.0.0/24,DIRECT
  - IP-CIDR,10.0.0.0/8,REJECT

  - DOMAIN-SUFFIX,.ntp.org,direct_interface

  - RULE-SET,ads,REJECT

  - DOMAIN-SUFFIX,.ir,direct_interface
  - GEOIP,IR,direct_interface
  - RULE-SET,ir,direct_interface
  - DOMAIN,gateway.icloud.com,direct_interface
  - DOMAIN-SUFFIX,.sn.mynetname.net,direct_interface

  - MATCH,auto
