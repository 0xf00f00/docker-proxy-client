mixed-port: 7890

allow-lan: true
bind-address: '*'

external-controller: 127.0.0.1:9697
secret: REQUIRE_ENV_CLASH_API_SECRET

hosts:
  naive: 127.0.0.1
  naive-uot: 127.0.0.1
  frpc-proxy: 10.20.0.15
  psiphon: 10.20.0.14
  xray: 10.20.0.18
  xray-fallback: 10.20.0.24
  byedpi: 10.20.0.20

# Clash router working mode
# rule: rule-based packet routing
# global: all packets will be forwarded to a single endpoint
# direct: directly forward the packets to the Internet
mode: rule

# info / warning / error / debug / silent
log-level: warning
ipv6: false

# use bundled geoip.metadb; no auto-download
geodata-mode: false
geo-auto-update: false

dns:
  enable: true
  listen: 0.0.0.0:15335
  default-nameserver:
    - 1.1.1.1#eth0
    - 1.0.0.1#eth0
  # enhanced-mode: fake-ip
  # fake-ip-range: 198.18.0.1/16 # Fake IP addresses pool CIDR
  nameserver:
    - https://1.1.1.1/dns-query#auto
    - https://8.8.8.8/dns-query#auto

sniffer:
  enable: true
  override-destination: false
  sniff:
    TLS:
      ports: [443]
    HTTP:
      ports: [80, 8080-8880]

tun:
  enable: true
  device: utun
  stack: system
  auto-route: false
  auto-redir: false
  auto-detect-interface: true

proxies:
  - name: "naive"
    type: socks5
    server: naive
    port: 1080
    udp: false
  - name: "naive-uot"
    type: socks5
    server: naive-uot
    port: 1081
    udp: true
  - name: "frpc"
    type: socks5
    server: frpc-proxy
    port: 1080
    udp: false
  - name: "psiphon"
    type: socks5
    server: psiphon
    port: 1080
    udp: true
  - name: "xray"
    type: socks5
    server: xray
    port: 10808
    udp: true
  - name: "xray-fallback"
    type: socks5
    server: xray-fallback
    port: 10809
    udp: true
  - name: "byedpi"
    type: socks5
    server: byedpi
    port: 1080
    udp: false
  - name: "direct"
    type: direct
    interface-name: eth0

proxy-groups:
  - name: auto
    type: fallback
    proxies:
      - xray
      - xray-fallback
      - naive-uot
      - naive
      - frpc
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    lazy: true
  - name: direct_interface
    type: select
    proxies: ['direct']
  - name: bypass
    type: fallback
    proxies: [byedpi, auto]
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    lazy: true

# update from https://github.com/bootmortis/iran-hosted-domains/releases/
rule-providers:
  ads:
    behavior: "domain"
    type: file
    path: "/root/.config/clash/rules/clash_rules_ads.yaml"
  ir:
    behavior: "domain"
    type: file
    path: "/root/.config/clash/rules/clash_rules_ir.yaml"

rules:
  # Local address
  - IP-CIDR,127.0.0.0/8,REJECT
  - IP-CIDR,172.16.0.0/12,REJECT
  - IP-CIDR,192.168.0.0/16,REJECT

  - IP-CIDR,10.20.0.0/24,DIRECT
  - IP-CIDR,10.0.0.0/8,REJECT

  - DOMAIN-SUFFIX,.ntp.org,direct_interface

  - RULE-SET,ads,REJECT

  - DOMAIN-SUFFIX,.ir,direct_interface
  - GEOIP,IR,direct_interface
  - RULE-SET,ir,direct_interface
  - DOMAIN,gateway.icloud.com,direct_interface
  - DOMAIN-SUFFIX,.sn.mynetname.net,direct_interface

  # container registries
  - DOMAIN-SUFFIX,docker.io,bypass
  - DOMAIN-SUFFIX,docker.com,bypass
  - DOMAIN-SUFFIX,ghcr.io,bypass
  - DOMAIN-SUFFIX,pkg-containers.githubusercontent.com,bypass

  # Google Meet calls (Meet only — general Google stays on the tunnel).
  # reject Meet's UDP media so it falls back fast to TURN-over-TLS (uplink drops UDP)
  # - AND,((NETWORK,UDP),(DST-PORT,19302-19309),(GEOIP,google)),REJECT
  # - AND,((NETWORK,UDP),(DST-PORT,3478),(GEOIP,google)),REJECT
  # - DOMAIN-SUFFIX,meet.google.com,bypass
  # - DOMAIN-SUFFIX,turns.goog,bypass
  # - IP-CIDR,142.250.82.0/24,bypass
  # - IP-CIDR,74.125.250.0/24,bypass
  # - IP-CIDR,74.125.247.128/32,bypass

  - MATCH,auto
